name: garagefront CI/CD

on:
    push:
        branches: [main]
    pull_request:

jobs:
    mirror:
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        runs-on: ubuntu-latest-go
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: generate installation token
              uses: https://github.com/actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.GH_APP_ID }}
                  private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
                  owner: ${{ vars.REPO_OWNER }}
                  repositories: ${{ vars.REPO_NAME }}
                  github-api-url: https://api.github.com
            - name: push main to GitHub
              run: |
                  git remote add github "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ vars.REPO_OWNER }}/${{ vars.REPO_NAME }}.git"
                  git push github main:main

    build:
        runs-on: ubuntu-latest-go
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - run: go mod download
            - run: go build ./...
            - run: go vet ./...

    test:
        runs-on: ubuntu-latest-go
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
            - run: go mod download
            - run: npm install --global pnpm@11
            - name: generate integration test fixtures
              run: sh scripts/integration/generate-fixtures.sh
            - run: go test ./... -race -count=1

    publish:
        needs: [build, test]
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        runs-on: ubuntu-latest-go
        steps:
            - uses: actions/checkout@v7
            - uses: docker/login-action@v4
              with:
                  registry: ${{ vars.REGISTRY }}
                  username: ${{ secrets.REGISTRY_CI_USERNAME }}
                  password: ${{ secrets.REGISTRY_CI_PASSWORD }}
            - name: build and push image
              run: |
                  docker build --tag "${{ vars.REGISTRY }}/${{ forgejo.repository }}:latest" .
                  docker push "${{ vars.REGISTRY }}/${{ forgejo.repository }}:latest"
